name: android-apk

# Builds the native Android app on every push to main and attaches the APK to the
# run, so a fresh installable build is always one tap away — no local toolchain.
on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - 'mobile/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - run: pnpm install --frozen-lockfile

      - name: Build APK
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aimong-us.onrender.com' }}
        run: bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aimong-us-apk
          path: |
            docs/app/*.apk
            docs/app/*.sha256
          retention-days: 90

      - name: Summary
        run: |
          {
            echo "### AImong Us APK"
            echo
            echo "Download the artifact above, open it on the phone, allow install from unknown sources."
            echo
            echo '```'
            cat docs/app/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
