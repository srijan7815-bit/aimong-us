name: android-apk

# Builds the native Android app on every push to main and attaches the APK to the
# run, so a fresh installable build is always one tap away — no local toolchain.
on:
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'packages/shared/**'
      - 'mobile/**'
      - 'scripts/build-apk.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships an Android SDK. `android-actions/setup-android@v3`
      # used to work here but now dies on `sdkmanager tools`: that package was removed
      # from the SDK repository, so the action exits 1 before anything is built.
      - name: Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - run: pnpm install --frozen-lockfile

      - name: Build APK
        env:
          SERVER_URL: ${{ vars.SERVER_URL || 'https://aimong-us.onrender.com' }}
        run: bash scripts/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aimong-us-apk
          path: |
            docs/app/*.apk
            docs/app/*.sha256
          retention-days: 90

      # A stable download link for the phone: the workflow run's artifact needs a
      # GitHub login, a release asset does not.
      - name: Attach the APK to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=android-latest
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "AImong Us — latest Android build" \
              --notes "Built automatically from main by .github/workflows/android.yml."
          gh release upload "$TAG" docs/app/*.apk docs/app/*.sha256 --clobber

      - name: Summary
        run: |
          {
            echo "### AImong Us APK"
            echo
            echo "Download the artifact above, open it on the phone, allow install from unknown sources."
            echo
            echo '```'
            cat docs/app/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
