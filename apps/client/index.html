<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>AImong Us</title>
    <meta
      name="description"
      content="AImong Us — a private social-deduction game with your friends and a few AI players."
    />

    <!-- Install as an app (Android Chrome / desktop Chrome / Edge) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#070b14" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AImong Us" />

    <!-- iOS: standalone launch + home-screen icon (no manifest support) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AImong" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-startup-image" href="/icons/splash-1080x1920.png" />

    <link rel="icon" href="/icons/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="shortcut icon" href="/icons/icon-192.png" />

    <style>
      /* Painted before the bundle loads, so a cold start never shows a white flash. */
      html,
      body {
        margin: 0;
        background: #070b14;
        color: #e8eefb;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      #boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      #boot .t {
        font-weight: 800;
        letter-spacing: -0.3px;
        font-size: 20px;
      }
      #boot .s {
        font-size: 13.5px;
        color: #9cb0cd;
        max-width: 30ch;
        line-height: 1.45;
      }
      #boot .bar {
        width: 148px;
        height: 3px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #12a594, #7ce2fe);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="/icons/icon-192.png" alt="" />
      <div class="t">AImong Us</div>
      <div class="s" id="boot-msg">Waking up the station…</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="app" class="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        AImong Us needs JavaScript. Open this link in Chrome on your phone.
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
